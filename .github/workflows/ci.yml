name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # --workers=1: run serially. render.spec's phosphor scene compiles its
      # feedback/FBM shader in ~85s under CI's software-WebGL2 (SwiftShader),
      # which is CPU-bound; running parallel workers lets it starve other specs
      # past their 30s timeout on the 2-core runner. This job only runs on main,
      # so the serial ~3min cost is fine for a stable gate.
      - run: npm run test:e2e -- --project=chromium --workers=1
